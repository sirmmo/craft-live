name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: craft-collab's transport conformance against nextcloud-live
        run: |
          git clone --depth 1 https://github.com/sirmmo/craft-collab "$RUNNER_TEMP/craft-collab"
          cargo build --manifest-path "$RUNNER_TEMP/craft-collab/Cargo.toml" --locked -p craft-collab-conformance
          CRAFT_COLLAB_CONFORMANCE="$RUNNER_TEMP/craft-collab/target/debug/craft-collab-conformance" \
            cargo test --locked -p nextcloud-live --test e2e craft_collab_conformance -- --nocapture

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t craft-live .
