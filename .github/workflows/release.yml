# Builds for each platform and attaches to the release of the pushed tag (v1.2.3): one zip of the
# nextcloud-live add-in per platform (the craft apps install it from the repository's address)
# and one tar.gz of the craft-live server per platform.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "craft-live $TAG" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64, ext: "" }
          - { os: macos-15, target: x86_64-apple-darwin, platform: macos-x86_64, ext: "" }
          # Static (musl), so it runs on any x86_64 Linux whatever its C library.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x86_64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p nextcloud-live -p craft-live
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          bin="target/$TARGET/release"
          version="${TAG#v}"
          dir=nextcloud-live
          mkdir -p "$dir"
          cp "$bin/nextcloud-live$EXT" README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          "$dir/nextcloud-live$EXT" --manifest | jq --arg cmd "./nextcloud-live$EXT" '.run.command = $cmd' >"$dir/plugin.json"
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "$dir/nextcloud-live$EXT"; fi
          zip_name="nextcloud-live-$version-$PLATFORM.zip"
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$zip_name" "$dir" >/dev/null
          elif [ "$RUNNER_OS" = macOS ]; then ditto -c -k --keepParent "$dir" "$zip_name"
          else zip -qr "$zip_name" "$dir"; fi
          server="craft-live-$version-$PLATFORM"
          mkdir -p "$server"
          cp "$bin/craft-live$EXT" README.md LICENSE-MIT LICENSE-APACHE craft-live.example.toml "$server/"
          cp -R docs "$server/"
          tar -czf "$server.tar.gz" "$server"
          echo "ZIP=$zip_name" >>"$GITHUB_ENV"
          echo "SERVER=$server.tar.gz" >>"$GITHUB_ENV"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ZIP" "$SERVER" --repo "$GITHUB_REPOSITORY" --clobber
