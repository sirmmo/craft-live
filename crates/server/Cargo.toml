[package]
name = "craft-live"
description = "A WOPI editor server for Nextcloud Office that opens spreadsheets, documents and presentations in the craft apps (GridCraft, WordCraft, DeckCraft) with live co-editing over y-websocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "craft_live"
path = "src/lib.rs"

[[bin]]
name = "craft-live"
path = "src/main.rs"

[dependencies]
