toml.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
getrandom.workspace = true
quick-xml.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
